<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <meta name="author" content="Catalin Broinas" />
    <meta name="description" content="A template for UI/UX." />
    <title>Autumn morning</title>
    <!-- MDB icon -->
    <link rel="icon" href="public/mdb-favicon.ico" type="image/x-icon" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="assets/vendor/fontawesome/css/fontawesome.min.css"
    />
    <link rel="stylesheet" href="assets/vendor/fontawesome/css/solid.min.css" />
    <link
      rel="stylesheet"
      href="assets/vendor/fontawesome/css/regular.min.css"
    />
    <link
      rel="stylesheet"
      href="assets/vendor/fontawesome/css/brands.min.css"
    />
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body class="bg-page">
    <!-- Header -->
    <header>
      <section class="intro section-margin">
        <div class="container">
          <div class="row align-items-center g-5">
            <div class="col-lg-6">
              <h1 class="intro__title">Autumn Morning</h1>
              <p class="intro__subtitle">Running Challenge</p>

              <p class="intro__text">
                Embrace the crisp autumn air, discover scenic trails, and
                challenge yourself to take one more step toward your running
                goals.
              </p>

              <a class="btn btn-primary intro__button" href="#challenge">
                Discover the Challenge
                <i class="fa-solid fa-arrow-right ms-2"></i>
              </a>
            </div>

            <div class="col-lg-6">
              <img
                class="intro__image"
                src="./assets/images/cover.webp"
                alt=""
                width="640"
                height="427"
              />
            </div>
          </div>
        </div>
      </section>
    </header>
    <!-- Header -->

    <!-- Main -->
    <main>
      <div class="container"></div>
    </main>
    <!-- Main -->

    <!-- Footer -->
    <footer class="footer"></footer>
    <!-- Footer -->

    <script type="module" src="src/js/main.js"></script>
  </body>
</html>
